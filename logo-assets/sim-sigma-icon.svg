<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
<title id="title">Sim Sigma icon</title>
<desc id="desc">Neon green sigma swing path launching a golf ball from a white simulator screen.</desc>
<defs>
  <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="blur1"/>
    <feGaussianBlur stdDeviation="12" result="blur2"/>
    <feMerge><feMergeNode in="blur2"/><feMergeNode in="blur1"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="whiteGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="blur1"/>
    <feGaussianBlur stdDeviation="8" result="blur2"/>
    <feMerge><feMergeNode in="blur2"/><feMergeNode in="blur1"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<g id="screen" filter="url(#whiteGlow)" fill="none" stroke="#F4F7F5" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter">
  <path d="M120 150 H560"/>
  <path d="M635 150 H760 V520 H120 V150"/>
  <path d="M120 520 L20 585"/>
  <path d="M760 520 L880 585"/>
</g>
<path id="sigma-trace" d="M385 525
  C280 525 255 445 330 390
  C415 330 600 245 735 65
  C630 245 415 275 350 365
  C310 420 450 425 470 495
  C485 552 415 605 315 570
  C225 540 225 435 325 390" 
  fill="none" stroke="#39D800" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#greenGlow)"/>
<g id="ball" transform="translate(818 50)" filter="url(#greenGlow)">
  <circle r="44" fill="#060706" stroke="#39D800" stroke-width="6"/>
  <g fill="#F4F7F5" opacity=".9">
    <circle cx="-12" cy="-22" r="4"/><circle cx="5" cy="-26" r="3.5"/><circle cx="20" cy="-18" r="4"/>
    <circle cx="-24" cy="-5" r="4"/><circle cx="-5" cy="-6" r="4"/><circle cx="14" cy="-3" r="4"/><circle cx="30" cy="6" r="3.5"/>
    <circle cx="-15" cy="14" r="3.5"/><circle cx="5" cy="16" r="4"/><circle cx="22" cy="22" r="3.5"/>
  </g>
</g>
</svg>