<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Sim Sigma logo</title>
<desc id="desc">Neon green swing path sigma mark launching a golf ball out of a white simulator screen with Sim Sigma wordmark and Outplay the Average tagline.</desc>
<defs>
  <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="blur1"/>
    <feGaussianBlur stdDeviation="12" result="blur2"/>
    <feMerge>
      <feMergeNode in="blur2"/>
      <feMergeNode in="blur1"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="whiteGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="blur1"/>
    <feGaussianBlur stdDeviation="8" result="blur2"/>
    <feMerge>
      <feMergeNode in="blur2"/>
      <feMergeNode in="blur1"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F4F7F5" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#F4F7F5" stop-opacity="0"/>
  </linearGradient>
</defs>


<!-- simulator screen -->
<g id="screen" filter="url(#whiteGlow)" fill="none" stroke="#F4F7F5" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter">
  <path d="M430 230 H900"/>
  <path d="M975 230 H1120 V610 H430 V230"/>
  <path d="M430 610 L250 720"/>
  <path d="M1120 610 L1350 720"/>
</g>

<!-- sigma swing path -->
<path id="sigma-trace" d="M705 615
  C600 615 575 535 650 480
  C735 420 920 335 1055 155
  C950 335 735 365 670 455
  C630 510 770 515 790 585
  C805 642 735 695 635 660
  C545 630 545 525 645 480" 
  fill="none" stroke="#39D800" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#greenGlow)"/>

<!-- ball -->
<g id="ball" transform="translate(1138 140)" filter="url(#greenGlow)">
  <circle r="44" fill="#060706" stroke="#39D800" stroke-width="6"/>
  <g fill="#F4F7F5" opacity=".9">
    <circle cx="-12" cy="-22" r="4"/><circle cx="5" cy="-26" r="3.5"/><circle cx="20" cy="-18" r="4"/>
    <circle cx="-24" cy="-5" r="4"/><circle cx="-5" cy="-6" r="4"/><circle cx="14" cy="-3" r="4"/><circle cx="30" cy="6" r="3.5"/>
    <circle cx="-15" cy="14" r="3.5"/><circle cx="5" cy="16" r="4"/><circle cx="22" cy="22" r="3.5"/>
  </g>
</g>

<!-- wordmark - use text for editability; convert to outlines in design app if needed -->
<g id="wordmark" font-family="Montserrat, Eurostile, Orbitron, Arial, sans-serif" font-weight="700" letter-spacing="26">
  <text x="800" y="820" text-anchor="middle" font-size="88" fill="#39D800" filter="url(#greenGlow)">SIM SIGMA</text>
</g>
<text id="tagline" x="800" y="895" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="34" font-weight="500" letter-spacing="18" fill="#F4F7F5" filter="url(#whiteGlow)">OUTPLAY THE AVERAGE</text>
</svg>